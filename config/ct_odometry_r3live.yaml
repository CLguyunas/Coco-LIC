odometry_mode: 1  # LIO = 0, LICO = 1

lidar_yaml: /r3live/lidar.yaml
imu_yaml: /r3live/imu.yaml
camera_yaml: /r3live/camera.yaml

# degenerate_seq_00.bag
# degenerate_seq_01.bag
# degenerate_seq_02.bag
# hku_campus_seq_00.bag
# hku_campus_seq_01.bag
# hku_park_00.bag
# hku_park_01.bag
bag_path: /path/to/xxx.bag
bag_start: 0.
bag_durr: -1


### SplineParams ###
t_add: 0.1  # [s] trajectory is updated every delta_t seconds, no adjustment needed
distance0: 0.03  # [s] the time duration corresponding to the first 4 control points, no adjustment needed
non_uniform: true  # true for non-uniform b-spline, false for uniform b-spline
division_coarse: 1  # if it is uniform, decide how many control points to place in every delta_t seconds, must be a non-zero integer


### OptimizationParams ###
t_begin_add_cam: 5.0  # [s] visual constraints will be added after the system has been successfully initialized for a while
lidar_iter: 2
use_lidar_scale: true  # scale the lidar weight
lidar_weight: 500.0
image_weight: 4.0
# imu：BMI088（200Hz）
# derived from data manual https://terra-1-g.djicdn.com/65c028cd298f4669a7f0e40e50ba1131/demo/avia/Livox%20AVIA%20User%20Manual_CHS.pdf
gyroscope_noise_density: 3.45557556e-03
gyroscope_random_walk: 2.617993833e-07                    
accelerometer_noise_density: 2.425376259e-02
accelerometer_random_walk: 1.96e-06         


### DSO-DetectOnly ###
# LiDAR 6DoF observability diagnostics. The detector, support injector, CASR
# router, and scheduler are read-only. The separate casr_intervention block
# below is the only opt-in estimator write path. Implementation constants,
# logging controls, safety limits, and derived scheduler anchors are fixed in
# src/degeneracy/dso_fixed_config.h and cannot be overridden by YAML.
dso_detect_only:
    enabled: true
    # Method hyperparameters: keep fixed across compared sequences. The exit
    # value is also reused by the CASR environment router and scheduler.
    enter_relative_eigenvalue_threshold: 3.0e-3
    exit_relative_eigenvalue_threshold: 6.0e-3
    support_enter_quality_threshold: 2.0e-2
    support_exit_quality_threshold: 5.0e-2

    # Knot-space CASR method hyperparameters. Shadow recovery and its temporal
    # scheduler are automatically enabled whenever DSO-DetectOnly is enabled.
    casr_shadow:
        principal_cosine_threshold: 7.0e-1
        projector_similarity_threshold: 8.0e-1

    # Experiment mode switches plus the only estimator-strength parameter.
    # Keep apply_to_estimator=false for dry-run audit; set it true only for an
    # armed run. The validated starting gain is 0.01.
    casr_intervention:
        enabled: true
        apply_to_estimator: false
        curvature_gain: 1.0e-2


### EvalutaionParams ###
is_evo_viral: false


### Gaussian-LIC ###
if_3dgs: true  # if sending data to back-end for incremental Gaussian mapping
lidar_skip: 10  # downsample: randomly select a LiDAR point every [lidar_skip] points
