odometry_mode: 1  # LIO = 0, LICO = 1

lidar_yaml: /r3live/lidar.yaml
imu_yaml: /r3live/imu.yaml
camera_yaml: /r3live/camera.yaml

# degenerate_seq_00.bag
# degenerate_seq_01.bag
# degenerate_seq_02.bag
# hku_campus_seq_00.bag
# hku_campus_seq_01.bag
# hku_park_00.bag
# hku_park_01.bag
bag_path: /path/to/xxx.bag
bag_start: 0.
bag_durr: -1


### SplineParams ###
t_add: 0.1  # [s] trajectory is updated every delta_t seconds, no adjustment needed
distance0: 0.03  # [s] the time duration corresponding to the first 4 control points, no adjustment needed
non_uniform: true  # true for non-uniform b-spline, false for uniform b-spline
division_coarse: 1  # if it is uniform, decide how many control points to place in every delta_t seconds, must be a non-zero integer


### OptimizationParams ###
t_begin_add_cam: 5.0  # [s] visual constraints will be added after the system has been successfully initialized for a while
lidar_iter: 2
use_lidar_scale: true  # scale the lidar weight
lidar_weight: 500.0
image_weight: 4.0
# imu：BMI088（200Hz）
# derived from data manual https://terra-1-g.djicdn.com/65c028cd298f4669a7f0e40e50ba1131/demo/avia/Livox%20AVIA%20User%20Manual_CHS.pdf
gyroscope_noise_density: 3.45557556e-03
gyroscope_random_walk: 2.617993833e-07                    
accelerometer_noise_density: 2.425376259e-02
accelerometer_random_walk: 1.96e-06         


### DSO-DetectOnly ###
# Read-only LiDAR 6DoF observability diagnostics. This does not add factors,
# change weights, update the map, or alter the marginalization prior.
dso_detect_only:
    enabled: true
    output_csv: true
    use_correspondence_scale: true
    min_correspondences: 30
    analyze_every_n_scans: 1
    print_every_n_scans: 20
    # Legacy hard count, retained for raw diagnostics and compatibility.
    relative_eigenvalue_threshold: 1.0e-3
    # Experimental temporal decision layer. These values are configurable and
    # must be validated on additional scenes before claiming generality.
    enter_relative_eigenvalue_threshold: 3.0e-3
    exit_relative_eigenvalue_threshold: 6.0e-3
    enter_consecutive_scans: 10
    exit_consecutive_scans: 10
    min_characteristic_range: 1.0
    max_characteristic_range: 100.0
    # Stage 2: exact four-control-point NURBS support diagnostics. The quality
    # is a generalized eigenvalue relative to ideal uniform sampling of the
    # same active non-uniform knot intervals (1.0 is ideal; lower is weaker).
    # This remains read-only and is not fed back into Ceres.
    support_enabled: true
    support_reference_samples_per_interval: 32
    support_max_control_points: 32
    support_enter_quality_threshold: 2.0e-2
    support_exit_quality_threshold: 5.0e-2
    support_enter_consecutive_scans: 10
    support_exit_consecutive_scans: 10
    # Stage 2 validation harness. It transforms only a timestamp/weight copy
    # read by the support diagnostic and writes a separate injection CSV.
    # Keep diagnostics_only true; a false value is refused by the code.
    support_injection:
        enabled: false
        diagnostics_only: true
        output_csv: true
        # timestamp_compression | phase_dropout | boundary_dropout |
        # temporal_thinning
        mode: timestamp_compression
        severity: 0.5
        # Normalized within-scan phase, independent of bag duration/sensor Hz.
        # Compression automatically preserves the earliest/latest timestamps
        # as boundary anchors. Use 0.0/1.0 for compression; 0.2/0.8 is a
        # useful dropout window.
        phase_start: 0.0
        phase_end: 1.0
        random_seed: 42
    # Stage 3: cause-adaptive subspace recovery in shadow mode. CASR-v2 keeps
    # support modes in the active 6K knot space and lifts map-frame environment
    # directions into that same space over the full scan. It does not add a
    # prior or change any estimator residual. A false shadow_only value is
    # refused by the code.
    casr_shadow:
        enabled: true
        shadow_only: true
        output_csv: true
        # Environment directions inside the hysteresis exit band remain
        # eligible while the persistent environment state is active.
        environment_relative_threshold: 6.0e-3
        # Numerical rank threshold only; physical support-mode selection still
        # comes from the generalized support-quality threshold above.
        support_basis_relative_singular_threshold: 1.0e-6
        # Tikhonov strength for the scan-wide pose-to-knot least-squares lift,
        # relative to the largest reference information eigenvalue.
        lift_regularization: 1.0e-6
        # cos(theta)>=0.7 defines a reliable 6K common principal direction.
        principal_cosine_threshold: 7.0e-1
        # Shadow-only temporal gate. Raw routes remain logged; stable routes
        # and recovery_ready require route continuity plus overlap-normalized
        # projector continuity on common global control points.
        route_consecutive_scans: 3
        projector_consecutive_scans: 3
        projector_similarity_threshold: 8.0e-1


### EvalutaionParams ###
is_evo_viral: false


### Gaussian-LIC ###
if_3dgs: true  # if sending data to back-end for incremental Gaussian mapping
lidar_skip: 10  # downsample: randomly select a LiDAR point every [lidar_skip] points
