name: Apply QI selection hotfix

on:
  push:
    branches:
      - feature/qi-lic-observation-management
    paths:
      - qi_hotfix/READY

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qi-lic-observation-management
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check qi_hotfix/selection_safe.patch
          git apply qi_hotfix/selection_safe.patch
      - name: Static checks
        run: |
          grep -q 'qi_lidar_obs_\.size()) <= budget' src/odom/odometry_manager.cpp
          grep -q 'qi_visual_obs_\.size()) <= budget' src/odom/odometry_manager.cpp
          ! grep -q 'best_gain < qi_config_\.selection_min_gain' src/odom/odometry_manager.cpp
          ! grep -q 'coverage >= qi_config_\.selection_info_ratio' src/odom/odometry_manager.cpp
      - name: Commit clean hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r qi_hotfix
          git rm .github/workflows/apply-qi-selection-hotfix.yml
          git add src/odom/odometry_manager.cpp
          git commit -m 'fix(qi): prevent aggressive observation under-selection'
          git push origin HEAD:feature/qi-lic-observation-management
